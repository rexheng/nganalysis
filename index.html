<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>%TITLE%</title>
<meta name="description" content="%DESC%" />
<meta property="og:title" content="Who backs whom in Berkeley’s November 2026 election" />
<meta property="og:description" content="%DESC%" />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#ffffff" />
<link rel="preload" href="/fonts/libre-franklin-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/data/graph.json" as="fetch" crossorigin />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='9' cy='10' r='5' fill='%23E69F00'/%3E%3Ccircle cx='23' cy='10' r='5' fill='%23332288'/%3E%3Ccircle cx='16' cy='23' r='5' fill='%2344AA99'/%3E%3Cpath d='M9 10L23 10L16 23Z' stroke='%23222' fill='none' stroke-width='1.5'/%3E%3C/svg%3E" />
</head>
<body class="app">
<a class="skip" href="#q">Skip to search</a>
<header class="appbar">
  <div class="ab-row">
    <h1 class="apptitle"><span class="kick">Daily Cal <span class="yr">· Election 2026 </span></span> Who backs whom in Berkeley</h1>
    <a class="storylink" href="/findings/">Analysis</a>
  </div>
  <div class="ab-row ab-tools">
    <div class="search" role="search">
      <label for="q" class="sr">Find a person or organization</label>
      <input id="q" type="text" role="combobox" placeholder="Search names" autocomplete="off" aria-autocomplete="list" aria-controls="qres" aria-expanded="false" />
      <ul id="qres" role="listbox" aria-label="Matches" hidden></ul>
    </div>
    <details id="filterbox" class="filterbox">
      <summary>Filter<span id="fcount" class="fcount" hidden></span></summary>
      <div class="fpanel">
        <fieldset><legend>Endorsers</legend><div class="fchips" id="ftypes"></div></fieldset>
        <fieldset><legend>Races</legend><div class="fchips" id="fraces"></div></fieldset>
        <p class="fnote"><span id="fstat" role="status"></span><button type="button" id="freset">Reset</button></p>
      </div>
    </details>
  </div>
</header>
<main class="appmain">
  <div class="graph-col">
    <div id="graph" aria-describedby="graph-desc"></div>
    <p id="graph-desc" class="sr"><!--GRAPH_SUMMARY--></p>
    <details id="legendbox" class="legendbox"><summary>Legend</summary><div id="legend" class="legend"></div><label class="switch"><input type="checkbox" id="showall" /> <span>Show one-candidate endorsers</span></label></details>
    <div class="zoom" role="group" aria-label="Zoom controls"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zreset" aria-label="Reset view">⟲</button></div>
    <div id="tooltip" class="tooltip" hidden></div>
    <noscript><p class="noscript">The graph needs JavaScript. See <a href="/findings/">findings and data</a>.</p></noscript>
  </div>
  <aside id="sheet" class="sheet" aria-label="Details">
    <button id="sheetbtn" class="sheet-handle" aria-expanded="false" aria-controls="panel"><span>Candidates and races</span></button>
    <div class="tabs" role="tablist" aria-label="View">
      <button role="tab" id="tab-cands" aria-selected="true" aria-controls="panel" tabindex="0" data-view="cands">Candidates</button>
      <button role="tab" id="tab-race" aria-selected="false" aria-controls="panel" tabindex="-1" data-view="race">By race</button>
    </div>
    <div id="panel" class="panel" role="tabpanel" aria-labelledby="tab-cands" tabindex="0"></div>
  </aside>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
